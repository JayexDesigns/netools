server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	# The bundles are content-hashed, so their names change whenever their contents do and they can be cached forever
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# index.html must always be revalidated, it is what points at the current bundles
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# Every unknown path falls back to index.html so the router can resolve it on the client
	location / {
		try_files $uri $uri/ /index.html;
	}
}
