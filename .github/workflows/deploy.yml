# Publishes the app in two places on every push:
#   - GitHub Pages: the static bundle, served at https://jayexdesigns.github.io/netools/
#   - Docker Hub: the multi-arch nginx image built from the Dockerfile (amd64, arm64
#     and arm/v7, so it also runs on Raspberry Pis)
# Both jobs wait for verify (build -> lint -> test, the order AGENTS.md mandates), so
# nothing is published that the suite hasn't passed.
#
# One-time setup:
#   - Settings -> Pages -> Source: "GitHub Actions"
#   - Variables: DOCKERHUB_USERNAME and DOCKERHUB_REPO (the image name on Docker Hub, e.g. "netools").
#     These are public identifiers, so they live in variables, not secrets (variables also don't
#     get masked into *** in the job logs the way a secret would)
#   - Secrets: DOCKERHUB_TOKEN (a Docker Hub access token)

name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:


permissions:
  contents: read

# Serialize runs per ref so two pushes can't deploy over each other mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: 12
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    # tsc -b type-checks the app, the configs and the tests, then vite emits the bundle
    - run: pnpm run build
    - run: pnpm run lint
    - run: pnpm run test

  pages:
    # Only the app on main is published to Pages; version tags only cut Docker images
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: 12
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    # Project pages are served from /<repo>/, so both the bundle URLs and the router's
    # basepath (import.meta.env.BASE_URL) must carry that prefix; the Docker image keeps /
    - name: Build for GitHub Pages
      run: pnpm run build
      env:
        BASE_PATH: /${{ github.event.repository.name }}/
    # Pages has no SPA fallback like nginx's try_files: a deep link like /netools/tldr-curl
    # would 404. Shipping index.html as the site's 404 page answers every unknown path with
    # the app, which the router then routes on the client
    - name: Add SPA fallback
      run: cp dist/index.html dist/404.html
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: dist
    - id: deployment
      uses: actions/deploy-pages@v5

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Emulator for any RUN step in a non-native stage; the Node build stage runs
    # natively on the runner (see --platform=$BUILDPLATFORM in the Dockerfile)
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # Tags: pushes to main become :main plus :latest (default branch), v1.2.3 tags become
    # :1.2.3 and :1.2, and every push carries a :sha-<short> tag
    - uses: docker/metadata-action@v6
      id: meta
      with:
        images: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    - uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # One manifest list for x86-64 PCs/servers and both 64-bit (arm64/v8) and
        # 32-bit (arm/v7) Raspberry Pis, so `docker pull` matches the host platform
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Reuse the pnpm fetch and vite build layers between runs via the Actions cache
        cache-from: type=gha
        cache-to: type=gha,mode=max
